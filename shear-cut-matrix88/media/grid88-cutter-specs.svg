<svg xmlns="http://w3.org" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Cleanroom Dark Bench Master Specifications Grid Base -->
  <rect width="800" height="600" fill="#010204" />
  <g stroke="#050a15" stroke-width="1" opacity="0.65">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450 M 0,500 L 800,500 M 0,550 L 800,550" />
    <path d="M 50,0 L 50,600 M 100,0 L 100,600 M 150,0 L 150,600 M 200,0 L 200,600 M 250,0 L 250,600 M 300,0 L 300,600 M 350,0 L 350,600 M 400,0 L 400,600 M 450,0 L 450,600 M 500,0 L 500,600 M 550,0 L 550,600 M 600,0 L 600,600 M 650,0 L 650,600 M 700,0 L 700,600 M 750,0 L 750,600" />
  </g>

  <!-- 350mm × 85mm SOLID CHASSIS GUIDE BAR SHELL -->
  <rect x="150" y="240" width="500" height="120" fill="#0f172a" stroke="#475569" stroke-width="3" rx="8" />
  <text x="400" y="305" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">350mm GUIDE BAR // PASSIVE WASP-OVIPOSITOR AIR JACKET</text>

  <!-- NATIVE 120μm MICROFLUIDIC INTERNAL CAPILLARY TRACKS -->
  <line x1="160" y1="260" x2="640" y2="260" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.7" />
  <line x1="160" y1="340" x2="640" y2="340" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.7" />

  <!-- 8.5mm PITCH DUAL-DENSITY SELF-SHARPENING TEETH ARRAY -->
  <g stroke="#e2e8f0" stroke-width="2" fill="none">
    <path d="M 160,240 L 165,220 L 168.5,240 M 168.5,240 L 173.5,220 L 177,240 M 177,240 L 182,220 L 185.5,240 M 185.5,240 L 190.5,220 L 194,240" />
    <path d="M 220,240 L 225,220 L 228.5,240 M 228.5,240 L 233.5,220 L 237,240" />
  </g>
  <text x="180" y="205" fill="#e2e8f0" font-family="monospace" font-size="8" font-weight="bold">8.5mm BEETLE TOOTH MATRIX</text>

  <!-- 4.5 kHz SOLID-STATE PIEZOELECTRIC ACTUATOR STRIDULATION SHIELD -->
  <rect x="200" y="275" width="400" height="50" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" rx="4" />
  <text x="400" y="365" fill="#a855f7" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">LEAFCUTTER CORE HARMONIC OSCILLATION: 4.5 kHz // STROKE: ±120μm</text>

  <!-- COMPLIANCE LABELS & TEXT MATRIX OVERLAYS -->
  <text x="400" y="55" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PROJECT SHEAR-CUT ARBOREAL MATERIAL-CLEAVING TOOL SPECIFICATIONS</text>
  <text x="400" y="515" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">SELF-SHARPENING EDGE RATIO: 2.6:1 VORTEX COMPLIANT // NOISE SIGNATURE: 0.0 dB</text>
  <text x="400" y="540" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Chassis Construction Process: SLA Dual-Density Co-Extrusion // Material Sourcing Budget: $261.00</text>
  <text x="400" y="575" fill="#475569" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">PROJECT SHEAR-CUT // ARBORIST RECLAIM REFERENCE BLUEPRINT v1.0.0</text>
