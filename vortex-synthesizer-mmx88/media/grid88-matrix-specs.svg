<svg xmlns="http://w3.org" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Cleanroom Dark Bench Master Specifications Grid Base -->
  <rect width="800" height="600" fill="#010204" />
  <g stroke="#050a15" stroke-width="1" opacity="0.65">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450 M 0,500 L 800,500 M 0,550 L 800,550" />
    <path d="M 50,0 L 50,600 M 100,0 L 100,600 M 150,0 L 150,600 M 200,0 L 200,600 M 250,0 L 250,600 M 300,0 L 300,600 M 350,0 L 350,600 M 400,0 L 400,600 M 450,0 L 450,600 M 500,0 L 500,600 M 550,0 L 550,600 M 600,0 L 600,600 M 650,0 L 650,600 M 700,0 L 700,600 M 750,0 L 750,600" />
  </g>

  <!-- VALVELESS MHD HYDRAULIC DRIVER CHANNELS OVERLAY -->
  <rect x="150" y="100" width="500" height="120" fill="#0f172a" stroke="#1e293b" stroke-width="2" rx="10" />
  <path d="M 160,160 H 640" stroke="#a855f7" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <text x="400" y="140" fill="#a855f7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">VALVELESS LIQUID-METAL MHD DRIVER CIRCUITS // RESOLUTION: ±1.0μm</text>

  <!-- TRI-CHAMBER CONCENTRIC SPINNERET EXTRUSION NOZZLE CORE -->
  <circle cx="400" cy="360" r="80" fill="#1e1b4b" stroke="#475569" stroke-width="3" />
  <circle cx="400" cy="360" r="50" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <circle cx="400" cy="360" r="20" fill="#020617" stroke="#be123c" stroke-width="2" />

  <!-- DYNAMIC DIFFERENTIAL PRESSURE ANTI-CROSS-BLEED ARROWS -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 400,290 V 305 M 400,430 V 415 M 330,360 H 345 M 470,360 H 455" />
    <polygon points="400,305 396,300 404,300" fill="#22d3ee" />
    <polygon points="400,415 396,420 404,420" fill="#22d3ee" />
  </g>

  <!-- METROLOGICAL DATA ANNOTATION OVERLAYS -->
  <text x="400" y="55" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PROJECT METAMATRIX MATERIAL SYNTHESIZER MECHANICAL BLUEPRINT</text>
  <text x="400" y="364" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">120μm PORT</text>
  <text x="400" y="465" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">400μm RESIN DIE HEAD // BUFFER: 1.5mm WALL</text>
  <text x="500" y="330" fill="#22d3ee" font-family="monospace" font-size="9" font-weight="bold" text-anchor="start">ANTI-CROSS-BLEED DELTA: +2.5 kPa</text>

  <text x="400" y="495" fill="#00f2ff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AMBIENT ULTRASONIC CAVITATION SINTERING ACTIVE // EXOSKELETON FRAME SELF-HEALING</text>
  <text x="400" y="525" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Centripetal Scrap Plastic Hopper Integrated // Feed-Stock Solvent: d-Limonene / Acetone Slurry</text>
  <text x="400" y="540" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Chassis Construction Layer Depth: 25.0μm // Net Capital Setup Sourcing Cost: $495.00 Base</text>
  
  <!-- Footer Matrix Title Stamp -->
  <text x="400" y="580" fill="#475569" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">PROJECT METAMATRIX // SYNTHESIZER SPECIFICATIONS REFERENCE BLUEPRINT v2.0.0</text>
</svg>
