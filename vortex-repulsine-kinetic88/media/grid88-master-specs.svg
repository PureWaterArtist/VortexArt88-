  <circle cx="285" cy="295" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="345" cy="295" r="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />

