<svg xmlns="http://w3.org" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Cleanroom Dark Bench Control Core Grid Base -->
  <rect width="800" height="600" fill="#010204" />
  <g stroke="#050a15" stroke-width="1" opacity="0.65">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400 M 0,450 L 800,450 M 0,500 L 800,500 M 0,550 L 800,550" />
    <path d="M 50,0 L 50,600 M 100,0 L 100,600 M 150,0 L 150,600 M 200,0 L 200,600 M 250,0 L 250,600 M 300,0 L 300,600 M 350,0 L 350,600 M 400,0 L 400,600 M 450,0 L 450,600 M 500,0 L 500,600 M 550,0 L 550,600 M 600,0 L 600,600 M 650,0 L 650,600 M 700,0 L 700,600 M 750,0 L 750,600" />
  </g>

  <!-- TAPERING PERIMETER VENTURI SLOT WALLS (3:1 Volumetric Ratio Boundary) -->
  <g fill="#1e3a8a" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round" opacity="0.9">
    <path d="M 150,150 L 330,380 L 360,380 L 220,150 Z" />
    <path d="M 650,150 L 470,380 L 440,380 L 580,150 Z" />
  </g>

  <!-- INWARD HIGH-VELOCITY PASSIVE AIRFLOW SIPHON STREAMS -->
  <g fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M 120,120 L 310,360" marker-end="url(#arrow-cyan)" />
    <path d="M 680,120 L 490,360" marker-end="url(#arrow-cyan)" />
  </g>
  <g fill="none" stroke="#f0fdfa" stroke-width="1.5" stroke-dasharray="6,4">
    <path d="M 120,120 L 310,360" />
    <path d="M 680,120 L 490,360" />
  </g>

  <!-- ATOMIC LAYER CVD GRAPHENE INTERNAL SUPER-SLIP PERIMETERS -->
  <path d="M 183,153 L 333,377" fill="none" stroke="#22d3ee" stroke-width="1.25" opacity="0.5" />
  <path d="M 617,153 L 467,377" fill="none" stroke="#22d3ee" stroke-width="1.25" opacity="0.5" />

  <!-- METROLOGICAL DATA ANNOTATION OVERLAYS -->
  <text x="400" y="55" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PERIMETER VENTURI SLOT ARCHITECTURE (3:1 COMPRESSION RATIO)</text>
  <text x="180" y="140" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SLOT APERTURE: 12.5mm</text>
  <text x="620" y="140" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">ENTRY PITCH: 15° SLOPE</text>
  <text x="400" y="400" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">INTERNAL GRAPHENE SUPER-SLIP THROAT: 4.16mm</text>

  <text x="400" y="460" fill="#00f2ff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PASSIVE VACUUM SIPHON ACTIVE // HEADWIND DRAG RESISTANCE ZEROED</text>
  <text x="400" y="530" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Nominal Air Mass Flow Rate: 2.8 kg/s // Friction Coefficient Floor: 0.005</text>
  <text x="400" y="545" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Total Symmetrical Slotted Array: 24 Inlets // Composite Shell: 45% Fused-Quartz / 55% CNC Matrix</text>

  <!-- Footer Matrix Title Stamp -->
  <text x="400" y="580" fill="#475569" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">PROJECT AETHERIS-SKATE // MODULE INTAKE-SHROUDS TIER v2.0.0</text>

  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9" />
    </marker>
  </defs>
</svg>
